# Workspace root — a virtual manifest (no [package] of its own).
#
# Members:
#   kernel/   the actual OS — no_std, a custom bare-metal target
#             (kernel/x86_64-basicos.json), built via kernel/.cargo/
#             config.toml's settings, which only apply when Cargo is
#             invoked with kernel/ as the working directory (config
#             discovery walks up from cwd, not from --manifest-path) —
#             see the top-level Makefile's cargo invocations.
#   fs/       the FAT32 filesystem format basicos speaks, decoupled from
#             the kernel it was originally written inside (see its own
#             doc comment) — an ordinary host-target crate, no special
#             target/build-std needed. `kernel` depends on it; a future
#             host-side tool (mkfs/fsck-equivalent) would too.
#
# `userland/` (C programs against the kernel's syscall ABI) and the
# standalone assembly test binaries at the repo root (testprog.s,
# forktest.s) aren't Cargo crates and so aren't workspace members —
# see userland/Makefile and the top-level Makefile for how those build.
[workspace]
resolver = "2"
members = ["kernel", "fs"]

# Cargo only honors [profile.*] in the workspace root, not in member
# manifests — these apply to every member, though only `kernel` (the
# no_std staticlib) really needs the panic="abort"/size-optimization
# settings; `fs` just inherits them harmlessly.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1      # Better optimization (slower compile)
opt-level = "z"        # Optimize for size
strip = "symbols"      # Strip symbols from staticlib
debug = false          # No debug info

# Even smaller release build (use with `cargo build --profile release-small`)
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"            # More aggressive LTO
