# Workspace root — a virtual manifest (no [package] of its own).
#
# Members:
#   kernel/   the actual OS — no_std, a custom bare-metal target
#             (kernel/x86_64-basicos.json), built via kernel/.cargo/
#             config.toml's settings, which only apply when Cargo is
#             invoked with kernel/ as the working directory (config
#             discovery walks up from cwd, not from --manifest-path) —
#             see the top-level Makefile's cargo invocations.
#   fs/       the FAT32 filesystem format basicos speaks, decoupled from
#             the kernel it was originally written inside (see its own
#             doc comment) — an ordinary host-target crate, no special
#             target/build-std needed. `kernel` depends on it; a future
#             host-side tool (mkfs/fsck-equivalent) would too.
#   sdk/      `basicos-sdk`, the Rust userspace SDK: syscall wrappers, a
#             global allocator, the `entry!` startup macro, `println!`.
#             Also holds the userspace toolchain config — config.toml
#             (target, build-std, static relocation, linker args) and
#             link.ld — which the Makefile hands to cargo via --config.
#   ext4/     the ext4 filesystem (read/write, journal replay) as a
#             host-testable no_std crate over `basicos-fs`'s BlockDevice —
#             tested against images made by the real mkfs.ext4/e2fsck.
#   net/      the IPv4 stack (Ethernet, ARP, IPv4, ICMP, UDP) as a sans-IO
#             state machine — like fs/, no_std and hardware-free, so it
#             is unit-tested on the host. The kernel supplies a NIC
#             driver behind its `NetDevice` trait.
#   init/     the first userspace program, built on the SDK.
#   programs/ every other Rust userspace program, one crate each
#             (`make new-prog NAME=foo` scaffolds one); the "programs/*"
#             glob below picks them up automatically.
#
# `userland/` (C programs against the kernel's syscall ABI) and the
# standalone assembly test binaries at the repo root (testprog.s,
# forktest.s) aren't Cargo crates and so aren't workspace members —
# see userland/Makefile and the top-level Makefile for how those build.
[workspace]
resolver = "2"
members = ["kernel", "fs", "ext4", "net", "init", "sdk", "programs/*"]
# A bare `cargo build`/`cargo test` at the root only touches `fs` and
# `net`, the members that are ordinary host-target crates. `kernel` and `init` both
# need their own target + build-std (kernel/.cargo/config.toml, which
# only applies with kernel/ as cwd; sdk/config.toml, passed via --config
# for the userspace crates), so building them from here would try — and
# fail — to build them for the host. The Makefile's `kernel-bin` and
# `rust-user` rules are how they get built.
default-members = ["fs", "ext4", "net"]

# Cargo only honors [profile.*] in the workspace root, not in member
# manifests — these apply to every member, though only `kernel` (the
# no_std staticlib) really needs the panic="abort"/size-optimization
# settings; `fs` just inherits them harmlessly.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1      # Better optimization (slower compile)
opt-level = "z"        # Optimize for size
strip = "symbols"      # Strip symbols from staticlib
debug = false          # No debug info

# Even smaller release build (use with `cargo build --profile release-small`)
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"            # More aggressive LTO
