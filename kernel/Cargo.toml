[package]
name = "basicos"
version = "0.1.0"
edition = "2021"

[dependencies]
# The FAT32 filesystem format, decoupled from the kernel (see its own
# doc comment) — optional because `mod fs` itself is gated behind
# `storage` (below), so reduced builds without it don't need to compile
# or link this at all.
basicos-fs = { path = "../fs", optional = true }

[lib]
name = "basicos"
crate-type = ["staticlib"]

[features]
# Every optional subsystem is on by default — `cargo build` (or plain
# `make`) gets the full kernel. Pick a subset with, e.g.:
#   cargo build --no-default-features --features heap,keyboard
# or override the Makefile's FEATURES variable (`make FEATURES=...`).
default = [
    "heap",
    "frame-alloc",
    "paging",
    "storage",
    "keyboard",
    "serial-input",
    "pit-100hz",
    "apic",
    "usermode-demo",
    "scheduler",
    "shell",
    "elf-loader",
]

# Heap allocator (`#[global_allocator]`, `mem::heap`) — pulls in `alloc`.
# Anything that needs `Vec`/`String`/`Box` (namely `storage`) needs this.
heap = []

# Physical frame allocator (`mem::frame`). Needed by `paging`, and by
# `storage` to reserve the initrd module's memory before use.
frame-alloc = []

# Virtual memory manager (`mem::paging`) on top of the frame allocator —
# map/unmap/translate beyond the boot-time identity map `entrypoint.s`
# already sets up (that part isn't gated; it's assembly, not Cargo).
paging = ["frame-alloc"]

# ATA (PIO) disk driver + FAT32 + initrd + a writable in-memory ramdisk,
# and the syscalls that use them (open/close/lseek/getdents64, the
# file-backed paths of read/write, and the basicos-specific `tree`
# syscall). DOS-style drive letters address the three: `A:` the
# ramdisk, `B:` the initrd, `C:` the main disk (see `fs::resolve_path`).
# Needs `alloc` for FAT32's in-memory buffers and the ramdisk's own
# backing store, `frame-alloc` to reserve the initrd's memory, and
# `dep:basicos-fs` for the format implementation itself.
storage = ["heap", "frame-alloc", "dep:basicos-fs"]

# PS/2 keyboard driver: scancode decoding, modifier tracking, the input
# ring buffer, and IRQ1 wiring. Off = IRQ1 stays masked at the PIC, so
# keypresses are silently ignored instead of hitting an unhandled vector.
keyboard = []

# Serial (COM1) *input* — the RX ring buffer, IRQ4 handler, and
# read_byte/read_line/etc. Serial *output* (used for kernel logging) is
# always available regardless of this feature.
serial-input = []

# Reprogram the PIT to 100 Hz on boot for ~10ms-resolution log
# timestamps. Off = the PIT stays at its power-on default (~18.2 Hz),
# and log timestamps are computed against that instead (coarser, but
# still correctly scaled).
pit-100hz = []

# Local APIC driver (`arch::x86_64::apic`): timer calibration, IPIs, and
# so on. Not wired into the boot sequence either way — legacy PIC mode
# (`pic.rs`) is what actually drives interrupts today — so this exists
# as available infrastructure for whoever picks up SMP/APIC-timer work.
apic = []

# The ring-3 jump: SYSCALL/SYSRET MSR setup, the syscall dispatch table,
# and `usermode::user_mode_stub`, which exercises it (including a
# storage demo, if `storage` is also enabled). Superseded at boot by
# `scheduler` when that's also on (see below) — off = kernel_main sets
# everything up and then just halts, no ring-3 code ever runs.
usermode-demo = []

# Process/task abstraction + a preemptive round-robin scheduler for
# ring-0 kernel threads (see `sched`) — real tasks, a real minimal
# context switch (xv6-style: only the callee-saved registers + RSP),
# preempted every PIT tick from the timer IRQ, not just cooperative.
# When this is on, kernel_main hands off to `sched::run()` (spawning a
# couple of demo tasks that prove preemption, plus the shell task if
# `shell` is also on) *instead of* the plain `usermode-demo` ring-3 jump
# — the two don't compose (see `sched`'s docs for why), and an
# interactive shell is the more useful default. `usermode-demo`'s own
# boot path still runs as before if `scheduler` is off.
scheduler = []

# An interactive command shell (builtins: help/echo/ls/cat/meminfo/
# uptime/ps/run/clear), reading from serial if `serial-input` is on,
# else the keyboard if `keyboard` is on, else it just sits idle. Runs as
# a scheduler task, so this implies `scheduler`.
shell = ["scheduler"]

# ELF64 loader: parses an ET_EXEC binary and copies its PT_LOAD segments
# into a process's own address space (`mem::paging`'s process zone —
# each process gets its own private physical backing at the same fixed
# virtual range). Also where `fork`/`execve`/`wait`/`mmap`/`brk` live
# (see `sched`'s module docs) — needs `usermode-demo` for the ring-3/
# syscall machinery, `storage` to read a binary off disk, and `paging`
# for the per-process address spaces themselves.
elf-loader = ["usermode-demo", "storage", "paging"]


bad-interrupt-panic = []

# Build profiles live in the workspace root Cargo.toml now — Cargo only
# honors [profile.*] there, not in member manifests.
